name: MCP source image and ECS deployment

on:
  pull_request:
    paths:
      - src/**
      - scripts/**
      - package.json
      - tsconfig.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy.yml
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - package.json
      - tsconfig.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deployment safety scenarios
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the source image and validate its final runtime offline
        run: |
          docker buildx build --platform linux/arm64 --load --tag mcp-candidate:local .
          docker run --rm --network none --entrypoint node mcp-candidate:local dist/src/test_tool_registry.js
          test "$(docker image inspect mcp-candidate:local --format '{{.Architecture}}')" = arm64

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'tiangong-ai/mcp-server' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: '339712838008'
      ECR_REPOSITORY: tiangong-ai-mcp
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and verify the exact image before AWS authentication
        run: |
          docker buildx build --platform linux/arm64 --load --tag mcp-candidate:local \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker run --rm --network none --entrypoint node mcp-candidate:local dist/src/test_tool_registry.js
          test "$(docker image inspect mcp-candidate:local --format '{{.Architecture}}')" = arm64
      - name: Record actual dependency resolution from the tested runtime image
        run: |
          docker run --rm --network none -i --entrypoint node -e SOURCE_REVISION="$GITHUB_SHA" \
            mcp-candidate:local --input-type=module < scripts/image_inventory.mjs > runtime-dependencies.json
      - name: Require the production OIDC role
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: test -n "$ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '339712838008'
          role-session-name: mcp-${{ github.run_id }}
          unset-current-credentials: true
      - name: Push a unique image and resolve its immutable ECR digest
        id: image
        run: |
          set -euo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          image_tag="sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker tag mcp-candidate:local "$registry/$ECR_REPOSITORY:$image_tag"
          docker push "$registry/$ECR_REPOSITORY:$image_tag"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$image_tag" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$registry/$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy, wait, verify and roll back a failed owned deployment
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          python3 scripts/deploy_ecs.py --image "$IMAGE" --execute --receipt deployment-receipt.json
      - name: Preserve sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-receipt.json
            runtime-dependencies.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Log out from ECR
        if: always()
        run: docker logout "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
